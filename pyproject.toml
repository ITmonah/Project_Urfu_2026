[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [
    ".venv",
    "artifacts",
    "dataset",
    "datasets",
    "datasetCreation",
    "runs",
]

[tool.pytest.ini_options]
addopts = "--basetemp=.pytest_tmp -m 'not data_quality'"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "data_quality: checks dataset archives and annotation consistency; requires DVC data to be pulled",
]
